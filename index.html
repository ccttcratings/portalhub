<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCTTC Portal Hub</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f9; text-align: center; padding: 40px 20px; margin: 0; }
    .card { background: white; max-width: 420px; margin: 0 auto; padding: 30px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { color: #1e293b; margin-bottom: 8px; font-size: 22px; }
    p { color: #64748b; font-size: 14px; margin-bottom: 30px; }
    .section { color: #475569; font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin: 24px 0 4px; text-align: left; }
    .btn { display: block; text-decoration: none; padding: 14px; margin: 12px 0; border-radius: 8px; font-weight: bold; font-size: 16px; transition: transform 0.1s; }
    .btn:active { transform: scale(0.98); }
    .preview { background-color: #1a73e8; color: white; }
    .edit { background-color: #10b981; color: white; }
    .site { background-color: #f59e0b; color: white; }
    .facebook { background-color: #1877f2; color: white; }
    .graph { background-color: #8b5cf6; color: white; }
  </style>
</head>
<body>
  <div class="card">
    <h2>CCTTC Portal Hub</h2>
    <p>Champaign County Table Tennis Club</p>

    <div class="section">Club</div>
    <a href="http://champaigntabletennis.com/" class="btn site" target="_blank" rel="noopener">Website</a>
    <a href="https://www.facebook.com/pages/Champaign-County-Table-Tennis-Club/182157415159139" class="btn facebook" target="_blank" rel="noopener">Facebook Page</a>

    <div class="section">Sign Up</div>
    <a href="https://tinyurl.com/ccttc-sign-up" class="btn preview" target="_blank" rel="noopener">Sign-up Form (Preview)</a>
    <a href="https://docs.google.com/forms/d/14a73b_Qcgus5fV3DmNzSGUFxFcZ8ibqYbux1qxs_bVE/edit" class="btn edit" target="_blank" rel="noopener">Sign-up Form (Edit)</a>
    <a href="https://tinyurl.com/Registered-CCTTC-Players" class="btn preview" target="_blank" rel="noopener">Sign-up Sheet (Preview)</a>
    <a href="https://docs.google.com/spreadsheets/d/1_Ou_wAKDovm5ASpc85cpGGbxKZcJkiEIEgifOE0ClBk/edit?gid=2067557144#gid=2067557144" class="btn edit" target="_blank" rel="noopener">Sign-up Sheet (Edit)</a>

    <div class="section">Ratings</div>
    <a href="https://tinyurl.com/CCTTC-Player-Ratings" class="btn preview" target="_blank" rel="noopener">Player Ratings (Preview)</a>
    <a href="https://docs.google.com/spreadsheets/d/1NdnC1kN831FVfcInOmFBfe-PU5tgKjFh3I-uxPdVGJM/edit?gid=1654717076#gid=1654717076" class="btn edit" target="_blank" rel="noopener">Player Ratings (Edit)</a>
    <a href="https://script.google.com/macros/s/AKfycbxhptFuoMFrCWwJ9yFew4Ej1XTjnm6G4X38hz-yccNW30tikf_F0sLIpOuhtZDR45pG/exec" class="btn graph" target="_blank" rel="noopener">Ratings Graph</a>
  </div>
</body>
</html>
